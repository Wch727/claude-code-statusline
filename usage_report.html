<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>用量统计 · Statusline</title>
<style>
:root{font-family:Segoe UI,"Microsoft YaHei",sans-serif;color:#202735;background:#f7f8fa;font-size:14px;font-variant-numeric:tabular-nums;--line:#e4e7ec;--blue:#245ec7;--muted:#6a7381}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,select{cursor:pointer}button:disabled{opacity:.5;cursor:wait}button,input,select{border:1px solid #d6dce5;background:#fff;color:inherit;border-radius:6px;padding:9px 12px}button:hover{background:#f1f5fc}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #98bbff;outline-offset:2px}button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}button.primary:hover{background:#194da8}
aside{position:fixed;inset:0 auto 0 0;width:190px;background:#f0f2f6;border-right:1px solid var(--line);padding:25px 14px;display:flex;flex-direction:column;gap:24px}.brand{font-size:20px;font-weight:650;display:flex;align-items:center;gap:10px;padding:0 9px}.brand svg{color:var(--blue)}.nav{padding:12px 14px;background:#e0e8f8;border-radius:6px;color:#174b9e;font-weight:600}.aside-note{margin-top:auto;padding:12px 10px;color:var(--muted);font-size:12px;line-height:1.8}.aside-note a{color:var(--muted)}
main{margin-left:190px;min-height:100vh;background:#fff}header{height:84px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 30px;gap:16px}h1{font-size:23px;margin:0;font-weight:650}.header-actions{display:flex;gap:10px;align-items:center}.sync-state{font-size:12px;color:var(--muted);max-width:240px;text-align:right;line-height:1.6}.body{padding:25px 30px}.summary{display:flex;gap:0;padding:0 0 25px;border-bottom:1px solid var(--line);margin-bottom:21px}.metric{padding:0 35px;border-right:1px solid var(--line);min-width:160px}.metric:first-child{padding-left:0}.metric:last-child{border:0}.metric .label{color:var(--muted);font-size:12px;margin-bottom:7px}.metric .value{font-size:24px;font-weight:620}.metric .value.money{color:#1b513d}.metric small{color:var(--muted);font-size:12px;font-weight:400}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:22px}.toolbar input{width:230px}.toolbar label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.toolbar .push{margin-left:auto}.tabs{display:flex;gap:25px;border-bottom:1px solid var(--line);margin-bottom:0}.tab{padding:0 1px 12px;border-bottom:3px solid #25364f;font-weight:600}.count{display:inline-block;background:#edf0f4;color:var(--muted);font-size:12px;padding:2px 6px;margin-left:7px;border-radius:4px}.table-wrap{overflow:auto;border:1px solid var(--line);border-top:0}table{border-collapse:collapse;width:100%;white-space:nowrap}th{background:#f0f2f6;text-align:left;color:#647080;font-size:12px;font-weight:500;padding:13px 14px;border-bottom:1px solid var(--line);position:sticky;top:0}td{padding:14px;border-bottom:1px solid var(--line);font-size:13px}tbody tr.request:hover{background:#f6f9ff}.num{text-align:right}.model{font-weight:500;max-width:250px;overflow:hidden;text-overflow:ellipsis}.money-cell{font-weight:620}.muted{color:var(--muted)}.app{color:#354d73}.badge{padding:3px 7px;border-radius:4px;font-size:11px;background:#edf1f5;color:#5c6676}.badge.peak{background:#fff0dc;color:#925717}.badge.offpeak{background:#e8f4ed;color:#28704b}.badge.unknown{background:#fff2e7;color:#8d541e}.detail-btn{border:0;background:transparent;color:var(--blue);padding:4px 1px;font-size:12px}.details td{background:#f8faff;padding:20px 22px;white-space:normal}.detail-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:24px}.detail-grid h3{font-size:12px;color:var(--muted);margin:0 0 10px;font-weight:500}.detail-grid p{margin:6px 0;line-height:1.7;font-size:12px;overflow-wrap:anywhere}.rate-list{display:grid;grid-template-columns:1fr auto;gap:7px 18px;font-size:12px;max-width:280px}.rate-list span:nth-child(even){text-align:right;font-weight:600}.footer{display:flex;justify-content:space-between;align-items:center;padding:15px 0;color:var(--muted);font-size:12px;gap:15px}.pagination{display:flex;align-items:center;gap:12px}.pagination button{padding:6px 10px}.notice{color:var(--muted);font-size:12px;line-height:1.8;margin:20px 0 0;border-top:1px solid var(--line);padding-top:14px}.empty{text-align:center;padding:75px 20px;color:var(--muted);line-height:2}.empty strong{display:block;color:#34445d;font-size:17px}.toast{position:fixed;right:24px;bottom:24px;max-width:520px;background:#21344e;color:white;padding:13px 18px;border-radius:6px;box-shadow:0 4px 15px #0002;z-index:10;line-height:1.6}.error{color:#a44b21}.live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#438566;margin-right:6px}
@media(min-width:1600px){.body{padding:28px 38px}header{padding:0 38px}td{padding:15px 18px}}
@media(max-width:1100px){aside{width:155px}main{margin-left:155px}.body{padding:20px}header{padding:0 20px}.metric{min-width:135px;padding:0 20px}.detail-grid{grid-template-columns:1fr 1fr}.header-actions .sync-state{display:none}}
@media(max-width:760px){aside{display:none}main{margin-left:0}header{height:auto;min-height:80px;flex-wrap:wrap;padding:18px;gap:14px}h1{font-size:21px}.body{padding:18px}.header-actions button{padding:8px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:20px}.metric{padding:0;border:0}.metric .value{font-size:21px}.toolbar{gap:8px}.toolbar input{width:100%}.toolbar .push{margin-left:0}.detail-grid{grid-template-columns:1fr}.footer{flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<aside><div class="brand"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10m8 10V4m8 16v-7"/></svg>Statusline</div><div class="nav">用量统计</div><div class="aside-note">逐请求记录<br>价格与峰谷依据可追溯<br><br><a href="https://github.com/farion1231/cc-switch" target="_blank" rel="noreferrer">基于 CC Switch 开源逻辑</a></div></aside>
<main><header><h1>用量统计</h1><div class="header-actions"><div id="syncState" class="sync-state"></div><button id="refresh">刷新日志</button><button id="sync" class="primary">同步价格</button></div></header>
<div class="body">
<section class="summary" aria-label="当前筛选统计"><div class="metric"><div class="label">参考费用</div><div id="totalCost" class="value money">—</div></div><div class="metric"><div class="label">请求数</div><div id="requests" class="value">0</div></div><div class="metric"><div class="label">Token 总量</div><div id="tokens" class="value">0</div></div><div class="metric"><div class="label">未定价请求</div><div id="unpriced" class="value">0</div></div></section>
<div class="toolbar"><select id="range" aria-label="时间范围"><option value="today">当天</option><option value="7" selected>近 7 天</option><option value="all">全部已记录</option></select><select id="model" aria-label="模型"><option value="">全部模型</option></select><select id="segment" aria-label="计费时段"><option value="">全部时段</option><option value="peak">高峰</option><option value="offpeak">空闲</option><option value="long">长上下文</option><option value="flat">固定单价</option><option value="unpriced">未定价</option></select><input id="search" type="search" placeholder="搜索模型或请求 ID" aria-label="搜索模型或请求 ID"><label class="push">显示时区<select id="zone"><option value="local">本地时间</option><option value="Asia/Shanghai">北京时间</option><option value="UTC">UTC</option></select></label><button id="export">导出 CSV</button></div>
<div class="tabs"><div class="tab">请求日志<span id="rowCount" class="count">0</span></div></div>
<div class="table-wrap"><table><thead><tr><th>时间</th><th>应用</th><th>供应商</th><th>模型</th><th>计费档</th><th class="num">费用</th><th class="num">新增输入</th><th class="num">输出</th><th class="num">缓存命中</th><th class="num">缓存写入</th><th class="num">速度</th><th class="num">首字</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="footer"><span id="freshness"><span class="live-dot"></span>本地请求日志</span><div class="pagination"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div></div>
<p class="notice">峰谷规则始终使用北京时间。请求起点、速度和首字时间沿用 CC Switch 的父链估算；起点缺失时会注明时间来源。每条费用保留首次记录的单价快照，导入旧记录时使用导入时可用的价格。供应商列显示“会话日志”，不根据模型名称猜测接入服务商。此处只统计 Token 参考费用，不含按次工具费用。</p>
</div></main><div id="toast" class="toast" role="status" hidden></div>
<script>
const initial=/*__INITIAL_DATA__*/;
let state=initial, filtered=[], page=0, expanded=new Set(), busy=false;
const PAGE_SIZE=50,$=id=>document.getElementById(id), live=/^https?:$/.test(location.protocol);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>new Intl.NumberFormat('en-US',{maximumFractionDigits:0}).format(n||0);
const compact=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1000?(n/1000).toFixed(1)+'K':String(n||0);
const zone=()=> $('zone').value==='local'?Intl.DateTimeFormat().resolvedOptions().timeZone:$('zone').value;
const dateKey=d=>new Intl.DateTimeFormat('en-CA',{timeZone:zone(),year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
const timeText=(ts,full=false)=>new Intl.DateTimeFormat('zh-CN',{timeZone:zone(),...(full?{year:'numeric',month:'2-digit',day:'2-digit'}:{}),hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).format(new Date(ts));
const money=(cost,currency)=>cost==null?'未定价':(currency==='CNY'?'¥':'$')+Number(cost).toFixed(4);
function segmentInfo(r){let s=r.segment||'';if(s.endsWith('offpeak'))return ['空闲','offpeak'];if(s.endsWith('peak'))return ['高峰','peak'];if(s.includes('calendar-unknown'))return ['日历缺失','unknown'];return [{long:'长上下文',short:'标准上下文',flat:'固定',legacy:'历史固定'}[s]||s,''];}
function toast(message){$('toast').textContent=message;$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,6500);}
function setOptions(){const chosen=$('model').value;const models=[...new Set(state.rows.map(r=>r.model))].sort();$('model').innerHTML='<option value="">全部模型</option>'+models.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('');if(models.includes(chosen))$('model').value=chosen;}
function updateStatus(){const s=state.status||{};$('syncState').innerHTML=s.error?`<span class="error">价格同步失败，继续使用旧数据</span>`:s.last_success?'价格更新 '+esc(timeText(s.last_success*1000,true)):'价格尚未在线同步';if(!live){$('sync').disabled=true;$('sync').title='这是离线快照；启动 --usage-web 后可同步价格';$('refresh').textContent='离线快照';$('refresh').disabled=true;}}
function applyFilters(reset=true){if(reset)page=0;let range=$('range').value,model=$('model').value,segment=$('segment').value,q=$('search').value.toLowerCase(),now=new Date();filtered=state.rows.filter(r=>{let date=new Date(r.timestamp);if(range==='today'&&dateKey(date)!==dateKey(now))return false;if(range==='7'&&now-date>7*86400000)return false;if(model&&r.model!==model)return false;if(q&&!`${r.model} ${r.raw_model} ${r.request_key}`.toLowerCase().includes(q))return false;if(segment==='unpriced'&&r.cost!=null&&!r.unpriced_reason)return false;if(segment&&segment!=='unpriced'){let b=segmentInfo(r)[1];if(segment==='flat'&&!['flat','short','legacy'].includes(r.segment))return false;if(segment==='long'&&r.segment!=='long')return false;if(['peak','offpeak'].includes(segment)&&b!==segment)return false;}return true;});render();}
function detailHtml(r){const rates=r.rates||{},symbol=r.currency==='CNY'?'¥':'$',rate=k=>rates[k]==null?'未配置':symbol+Number(rates[k]).toLocaleString('en-US',{maximumFractionDigits:6})+' / 百万 Token';return `<tr class="details"><td colspan="13"><div class="detail-grid"><div><h3>本次计价</h3><p><strong>${esc(segmentInfo(r)[0])}</strong> · ${esc(r.currency)} · ${esc(r.source)}</p><p>请求时间：${esc(timeText(r.timestamp,true))}</p><p>时间来源：${esc(r.timestamp_source)}</p><p>单价记录：${esc(timeText(r.price_captured_at*1000,true))}</p>${r.unpriced_reason?`<p class="error">${esc(r.unpriced_reason)}</p>`:''}</div><div><h3>保留的单价快照</h3><div class="rate-list"><span>新增输入</span><span>${esc(rate('input'))}</span><span>输出</span><span>${esc(rate('output'))}</span><span>缓存命中</span><span>${esc(rate('cache_read'))}</span><span>缓存写入</span><span>${esc(rate('cache_write'))}</span>${(r.tokens.cache_write_1h||0)>0?`<span>一小时写入</span><span>${esc(rate('cache_write_1h'))}</span>`:''}</div></div><div><h3>请求标识</h3><p>原始模型：${esc(r.raw_model||r.model)}</p><p>请求：${esc(r.request_key)}</p><p>会话：${esc(r.session_key)}</p><p class="muted">接入供应商未由会话记录提供。</p></div></div></td></tr>`;}
function render(){let cny=0,usd=0,total=0,unknown=0;for(const r of filtered){if(r.cost==null||r.unpriced_reason)unknown++;if(r.cost!=null){if(r.currency==='CNY')cny+=r.cost;else usd+=r.cost;}for(const k of ['input','output','cache_read','cache_write'])total+=r.tokens[k]||0;}$('totalCost').innerHTML=(cny?'¥'+cny.toFixed(3):'')+(cny&&usd?' <small>+</small> ':'')+(usd?'$'+usd.toFixed(3):'')||'—';$('requests').textContent=fmt(filtered.length);$('tokens').textContent=compact(total);$('unpriced').textContent=fmt(unknown);$('rowCount').textContent=fmt(filtered.length);let pages=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));page=Math.min(page,pages-1);let slice=filtered.slice(page*PAGE_SIZE,(page+1)*PAGE_SIZE);$('rows').innerHTML=slice.map((r,i)=>{const key=r.session_key+':'+r.request_key,[label,badge]=segmentInfo(r),speed=r.latency_ms&&r.tokens.output>=200?'≈'+Math.round(r.tokens.output/(r.latency_ms/1000))+' tok/s':'—',first=r.first_token_ms?'≈'+(r.first_token_ms/1000).toFixed(1)+'s':'—';return `<tr class="request"><td title="${esc(timeText(r.timestamp,true))}">${esc(timeText(r.timestamp,$('range').value!=='today'))}</td><td class="app">${esc(r.app||'Claude Code')}</td><td class="muted" title="会话记录未提供实际接入供应商">${esc(r.provider||'会话日志')}</td><td class="model" title="${esc(r.model)}">${esc(r.model)}</td><td><span class="badge ${badge}">${esc(label)}</span></td><td class="num money-cell ${r.cost==null?'muted':''}">${esc(money(r.cost,r.currency))}</td><td class="num">${fmt(r.tokens.input)}</td><td class="num">${fmt(r.tokens.output)}</td><td class="num">${compact(r.tokens.cache_read)}</td><td class="num">${compact(r.tokens.cache_write)}</td><td class="num muted">${speed}</td><td class="num muted">${first}</td><td><button class="detail-btn" data-index="${page*PAGE_SIZE+i}" aria-expanded="${expanded.has(key)}">${expanded.has(key)?'收起':'详情'}</button></td></tr>`+(expanded.has(key)?detailHtml(r):'');}).join('')||'<tr><td colspan="13" class="empty"><strong>这个范围还没有请求记录</strong>状态栏运行后会自动记录用量，也可以切换到“全部已记录”。</td></tr>';$('page').textContent=`${page+1} / ${pages}`;$('prev').disabled=page===0;$('next').disabled=page>=pages-1;$('freshness').innerHTML=`<span class="live-dot"></span>${live?'本地日志，每 10 秒刷新':'离线日志快照'} · 已加载 ${fmt(state.rows.length)} 条${state.rows.length>=5000?'（最近 5,000 条）':''}`;}
async function refresh(show=false){if(!live)return;try{const res=await fetch('/api/usage');if(!res.ok)throw Error('读取日志失败');const data=await res.json();state={...state,...data};setOptions();updateStatus();applyFilters(false);if(show)toast('请求日志已刷新');}catch(e){if(show)toast(e.message);}}
$('rows').addEventListener('click',e=>{let button=e.target.closest('[data-index]');if(!button)return;const r=filtered[Number(button.dataset.index)],key=r.session_key+':'+r.request_key;expanded.has(key)?expanded.delete(key):expanded.add(key);render();});
for(const id of ['range','model','segment','zone'])$(id).addEventListener('change',()=>applyFilters());$('search').addEventListener('input',()=>applyFilters());$('prev').onclick=()=>{page--;render();};$('next').onclick=()=>{page++;render();};$('refresh').onclick=()=>refresh(true);
$('sync').onclick=async()=>{if(busy)return;busy=true;$('sync').disabled=true;$('sync').textContent='正在同步…';try{const res=await fetch('/api/sync',{method:'POST',headers:{'X-Statusline-Token':initial.token}});const data=await res.json();if(!res.ok)throw Error(data.error||'价格同步失败');const s=data.summary;toast(`价格已同步：更新 ${s.updated}，新增 ${s.added}，保留本地规则 ${s.protected}`);}catch(e){toast(e.message);}finally{busy=false;$('sync').disabled=false;$('sync').textContent='同步价格';await refresh();}};
$('export').onclick=()=>{const csvCell=v=>{let s=String(v??'');if(/^[=+@-]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"';};const fields=['时间(UTC)','模型','原始模型','来源','计费档','币种','参考费用','新增输入','输出','缓存命中','缓存写入','请求ID'];const lines=[fields,...filtered.map(r=>[r.timestamp,r.model,r.raw_model,r.provider,r.segment,r.currency,r.cost,r.tokens.input,r.tokens.output,r.tokens.cache_read,r.tokens.cache_write,r.request_key])];const blob=new Blob(['\ufeff'+lines.map(l=>l.map(csvCell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='statusline-usage.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
setOptions();updateStatus();applyFilters();setInterval(()=>{if(!document.hidden)refresh();},10000);
</script></body></html>
